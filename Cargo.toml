[package]
name = "distop"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
sysinfo = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"
anyhow = "1.0.102"
procfs = "0.18.0"
tokio-util = { version = "0.7.18", features = ["codec"] }
futures-util = "0.3.32"
ratatui = "0.30.0"
crossterm = "0.29.0"
ratatui-macros = "0.7.1"
systemstat = "0.2.7"
sinfo = "0.2.0"
